<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillSwap Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Optional: Tailwind CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <a href="{% if 'user' in session %}/discover{% else %}/{% endif %}"
        class="text-xl font-bold hover:underline">
            SkillSwap
        </a>
        <a href="/" class="text-blue-600 hover:underline">Home</a>
    </nav>

    <div class="flex items-center justify-center min-h-[calc(100vh-4rem)]">
        <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center">Login to SkillSwap</h2>

            {% if error %}
                <div class="bg-red-100 text-red-700 p-2 mb-4 rounded">
                    {{ error }}
                </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block mb-1 font-medium">Email or Username</label>
                    <input 
                        type="text" 
                        name="name" 
                        required
                        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-300"
                    >
                </div>

                <div>
                    <label class="block mb-1 font-medium">Password</label>
                    <input 
                        type="password" 
                        name="password" 
                        required
                        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-300"
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
                >
                    Login
                </button>
            </form>

            <p class="text-center text-sm mt-4">
                Don't have an account?
                <a href="/register" class="text-blue-600 hover:underline">Register</a>
            </p>
        </div>
    </div>

</body>
</html>
