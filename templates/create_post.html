<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <a href="/discover" class="text-xl font-bold hover:underline">SkillSwap</a>
        <div class="space-x-4">
            <a href="/me" class="text-gray-700 hover:underline">{{ session["user"] }}</a>
            <a href="/logout" class="text-blue-600 hover:underline">Logout</a>
        </div>
    </nav>

    <div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-4">Create a New Post</h2>

        <form action="/post" method="POST" class="space-y-4">

            <div>
                <label class="block font-semibold mb-1">Title</label>
                <input name="title" required
                       class="w-full border p-2 rounded"
                       placeholder="Post title">
            </div>

            <div>
                <label class="block font-semibold mb-1">Description</label>
                <textarea name="description" required
                          class="w-full border p-2 rounded"
                          placeholder="Describe your post"></textarea>
            </div>

            <div>
                <label class="block font-semibold mb-1">Category</label>
                <select name="category_id" required
                        class="w-full border p-2 rounded">
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.category }}</option>
                    {% endfor %}
                </select>
            </div>

            <button class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
                Create Post
            </button>
        </form>
    </div>

</body>
</html>
